<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#020814" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Tidal Fortune</title>
  <link rel="stylesheet" href="/css/game.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="ui">
      <section id="loading" class="screen">
        <div class="logo">
          <div class="logo-main">TIDAL</div>
          <div class="logo-sub">FORTUNE</div>
        </div>
        <div class="loadbar"><div class="loadfill" id="loadfill"></div></div>
        <div class="loadtext" id="loadtext">Loading…</div>
      </section>

      <section id="login" class="screen hidden">
        <div class="logo small">
          <div class="logo-main">TIDAL</div>
          <div class="logo-sub">FORTUNE</div>
        </div>
        <form class="login-panel" id="loginForm" autocomplete="on">
          <div class="field">
            <span class="field-icon">👤</span>
            <input id="lu" name="username" placeholder="Account" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="24" />
          </div>
          <div class="field">
            <span class="field-icon">🔒</span>
            <input id="lp" name="password" type="password" placeholder="Password" autocomplete="current-password" maxlength="64" />
            <button type="button" class="eye-btn" id="lpEye" title="Show password" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/><path d="M3 3l18 18"/></svg></button>
          </div>
          <label class="remember"><input type="checkbox" id="lr" checked /><span class="check"></span>Remember me</label>
          <button class="btn-gold" type="submit" id="loginBtn">LOGIN</button>
          <div class="login-err" id="loginErr"></div>
        </form>
      </section>

      <section id="lobby" class="screen hidden">
        <header class="topbar">
          <div class="profile" id="profileBtn" title="Edit profile">
            <div class="avatar" id="avatar">?</div>
            <div>
              <div class="nick"><span id="nick"></span></div>
              <div class="uid" id="uid"></div>
            </div>
          </div>
          <div class="balance"><span class="coin"></span><span id="lobbyBal">0</span></div>
          <div class="tools">
            <button class="round audio-btn" data-act="sound" title="Sound effects"><svg viewBox="-14 -14 28 28" aria-hidden="true"><path d="M-11-4h6l7-6v20l-7-6h-6z" fill="currentColor"/><path d="M5-5a7 7 0 0 1 0 10M8-9a12 12 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
            <button class="round audio-btn" data-act="music" title="Music"><svg viewBox="-14 -14 28 28" aria-hidden="true"><path d="M-4 7V-9l13-3V4" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="-4" y="-9.6" width="13" height="3.6" fill="currentColor"/><ellipse cx="-7.5" cy="7.5" rx="4.2" ry="3.2" transform="rotate(-23 -7.5 7.5)" fill="currentColor"/><ellipse cx="5.5" cy="4.5" rx="4.2" ry="3.2" transform="rotate(-23 5.5 4.5)" fill="currentColor"/></svg></button>
            <button class="round" data-act="full" title="Fullscreen">⛶</button>
            <button class="round" data-act="logout" title="Logout">⏻</button>
          </div>
        </header>
        <nav class="tabs">
          <button data-tab="all" class="on">ALL GAMES</button>
          <button data-tab="fish">FISH HUNT</button>
          <button data-tab="slot">777 SLOTS</button>
        </nav>
        <div class="tiles" id="tiles"></div>
      </section>
    </div>

    <div id="profile" class="hidden">
      <div class="pf-box">
        <div class="pf-head">
          <div class="pf-title">MY PROFILE</div>
          <button class="round" id="pfClose" title="Close">✕</button>
        </div>
        <div class="pf-body">
          <form class="pf-col" id="pfNickForm">
            <div class="pf-label">PLAYER NAME</div>
            <div class="pf-field"><input id="pfNick" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Your name" /></div>
            <div class="pf-hint">2–16 letters, numbers or spaces. Shown to other players at the table.</div>
            <div class="pf-label">ACCOUNT</div>
            <div class="pf-account" id="pfUser"></div>
            <button class="btn-gold pf-btn" type="submit">SAVE NAME</button>
          </form>
          <form class="pf-col" id="pfPassForm" autocomplete="on">
            <div class="pf-label">CHANGE PASSWORD</div>
            <div class="pf-field">
              <input id="pfCur" type="password" placeholder="Current password" autocomplete="current-password" maxlength="64" />
              <button type="button" class="eye-btn" data-for="pfCur" title="Show password" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/><path d="M3 3l18 18"/></svg></button>
            </div>
            <div class="pf-field">
              <input id="pfNew" type="password" placeholder="New password (6+ characters)" autocomplete="new-password" maxlength="64" />
              <button type="button" class="eye-btn" data-for="pfNew" title="Show password" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/><path d="M3 3l18 18"/></svg></button>
            </div>
            <div class="pf-field">
              <input id="pfNew2" type="password" placeholder="Confirm new password" autocomplete="new-password" maxlength="64" />
              <button type="button" class="eye-btn" data-for="pfNew2" title="Show password" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.5"/><path d="M3 3l18 18"/></svg></button>
            </div>
            <button class="btn-gold pf-btn" type="submit">CHANGE PASSWORD</button>
          </form>
        </div>
      </div>
    </div>

    <div id="toast"></div>
    <div id="modal" class="hidden">
      <div class="modal-box">
        <div class="modal-text" id="modalText"></div>
        <div class="modal-btns">
          <button class="btn-gold" id="modalOk">OK</button>
          <button class="btn-blue" id="modalCancel">CANCEL</button>
        </div>
      </div>
    </div>
    <div id="reconnect" class="hidden"><div class="spinner"></div><div>Reconnecting…</div></div>
    <div id="curtain"></div>
  </div>
  <div id="rotate"><div class="rotate-icon">⟳</div>Please rotate your device to landscape</div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
